# Beauty News layer C: refresh src/news/news-snapshot.json from the live feeds every 6 hours,
# so a cold start on Render shows recent real headlines at once. Never writes a too-small snapshot.
name: Beauty News snapshot
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: news-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/refresh-news.mjs
      - run: node --test test/news.test.mjs
      - name: Commit the snapshot if it changed
        run: |
          if git diff --quiet -- src/news/news-snapshot.json; then echo "no change"; exit 0; fi
          git config user.name "John Khan"
          git config user.email "309250657+ALENZACODES@users.noreply.github.com"
          git add src/news/news-snapshot.json
          git commit -m "Beauty News: refresh the saved snapshot from live feeds"
          git pull --rebase origin main
          git push origin HEAD:main
